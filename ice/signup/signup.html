<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer{
            border: navy solid 12px;
            background-color: white;
            width: 50%;
            margin: 100px;
            border-radius: 25px;
            overflow: hidden;
            margin: 100px auto;
            position: relative;
            
        }
        #head{
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            position: relative;
        }
        #myForm{
            display: grid;
            grid-template-columns: 1fr 1fr;
            
        }
        #feed{
            width: 100%;
            object-fit: cover;
            height: 330px;
        }
        #scriptures{
            display: flex;
            gap: 5px;
            grid-column: 1/3;
        }
        #scriptures img{
            width: 19.5%;
        }
        #head h3{
            position: absolute;
            font-size: 2em;
            color: white;
            text-shadow: 2px 2px black;
        }
        h2{
            text-align: center;
            margin: 10px;
        }
        #closeBtn{
            position: absolute;
            top: 10px;
            left: 10px;
        }
        input{
            margin: 5px;
        }
        label{
            grid-column: 1/2;
            margin-left: 20px;
            margin-right: 20px;
        }
        section{
            grid-column: 1/3;
            margin: 0 auto;
            text-align: center;
            margin: 5px;
        }
        button{
            justify-self: center;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="formContainer">
        <div id="head">
            <h3>Daily Feed Scripture a Day</h3>
            <img id="feed" src="images/jesus_feeds_5000.jpeg" alt="Picture of Jesus Christ"/>
        </div>
        <h2>Sign Up for Daily Scripture Feed</h2>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

            <div id="scriptures">
                <img src="images\book_of_mormon.webp" alt="Book of Mormon Picture"/>
                <img src="images\doctrine_and_covenants.webp" alt="Doctrine and Covenants Picture"/>
                <img src="images\new_testament.webp" alt="New Testament Picture"/>
                <img src="images\old_testament.webp" alt="Old Testament Picture"/>
                <img src="images\pearl_of_great_price.webp" alt="Pearl of Great Price Picture"/>
            </div>
        </form>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
