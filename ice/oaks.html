<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dallin H. Oaks</title>
    <style>
      /* Insert styles here, this is called an internal stylesheet  */
      body {
        background: #ffecd7;
        margin: 0;
        padding-inline-start: 0;
      }
      .card {
        text-align: center;
        background-color: #008db1;
        border: 5px solid #004e63;
        border-radius: 20px;
        padding: 50px;
        margin: 0 auto;
        width: 400px;
      }
      .text {
        color: white;
      }
      a {
        color: #91e4fb;
        text-decoration: none;
        margin: 0;
      }
      h1 {
        font-family: Helvetica, sans-serif;
      }
      #card-img {
        border: 5px solid white;
        transition: transform 0.5s;
        box-shadow: 5px 5px 10px #41423c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <h1>President Dallin H. Oaks</h1>
        <div id="subtext">
          <p>
            <a href="https://www.churchofjesuschrist.org/">18th President of the Church of Jesus Christ of Latter_day Saints</a>
          </p>
        </div>
        <div id="card-img">
            <img src="images\dallinhoaks.jpg" alt="Profile Picture of President Oaks"/>
        </div>
      </div>
      <div id="background"></div>
    </div>
  </body>
</html>
